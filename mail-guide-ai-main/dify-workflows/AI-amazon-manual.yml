            {{#1745391970382.output#}}

            </买家订单信息>

            <买家物流信息>

            {{#1745463145529.output#}}

            </买家物流信息>

            <店铺信息>

            {{#1755143146906.output#}}

            </店铺信息>

            <买家和卖家上下文>

            {{#1741571480087.Context#}}

            </买家和卖家上下文>

            <指导思想>

            {{#1741571480087.GuidingPrinciple#}}

            </指导思想>

            <常规处理思路>

            #### **一、物流进度查询**

            1. **必要回复内容**

            - 提供订单中**每个产品对应的跟踪号及承运商**（亚马逊同步发货可能仅显示一个跟踪号，需主动核实其他包裹信息）。

            - 同步所有包裹的**最新物流状态**，避免遗漏部分包裹的进度。

            - *示例话术*：

            > “经核实，您的订单共分X个包裹发货，跟踪号分别为[XXX/XXX]，承运商为[XXX]。当前物流状态如下：包裹1已抵达[地点]，包裹2显示[状态]...”

            ---

            #### **二、包裹未上网/物流中途停滞**

            **处理优先级：买家态度 > 账号表现 > 延迟时长**

            | **延迟天数** | **处理方案** | **账号规模策略** |

            |---------------|---------------|-------------------|

            | **<5天** | 安抚等待，不主动提退款 | - 小账号（<1000单）：次日跟进确认，避免投诉<br>- 大账号：常规安抚 |

            | **5-10天** | 买家态度差时，按货值提供**部分退款**（参考历史比例） | 欧洲站优先退款，美国站协商补寄 |

            | **>10天** | 按**丢包处理**：全额退款或补寄 | 大账号可协商方案，小账号直接退款 |

            ---

            #### **三、物流途中破损（美国站高发）**

            1. **检查物流轨迹关键词**

            - 显示 **“Return to sender”** → 按买家需求补寄/退款。

            - 仅显示 **“Damaged”** → 观察1-3天，FedEx可能重新打包派送。

            2. **话术要点**：

            > “已核实包裹状态为轻微破损，物流方可能已重新包装派送。若3日内仍未收到，我们将为您优先处理补发。”

            ---

            #### **四、签收未收到**

            **场景分类处理**：

            1. **地址不一致**

            - 添加至索赔表，协商补寄/退款。

            - *欧洲特殊处理*：若妥投至包裹商店，引导买家自提（80%不再派送）。


            2. **地址一致但未收到**

            - **首次联系**：提供FedEx交付图片/位置，指导买家自查（查监控、问邻居/管理员、联系当地FedEx）。

            - **未回复时**：

            | **账号类型** | **处理方案** |

            |--------------|---------------|

            | 小账号（<1000单） | 次日跟进，未解决则退款 |

            | 大账号（ODR<0.4%） | 不主动处理，降低干预成本 |

            ---

            #### **五、发错货**

            1. **证据要求**：

            必须索取以下4张图片：

            - 含SKU的包装盒、标签特写、内物照片、运输标签。

            2. **责任归属处理**：

            - 仓库责任 → 无条件补寄/退款。

            - 工厂责任 → 协商补寄（低值货<150美元可弃货）。


            ---


            #### **六、妥投失败退件**

            **核心原则：不退件到仓即处理，避免拖延**

            1. **退件原因分类**：

            - 地址错误 → 补寄前二次确认地址。

            - 包裹店未提货（欧洲高发）→ 明确告知需自提，否则退款。

            2. **买家未明确诉求**：

            - 首次回复询问补寄/退款意向 → 24小时未回复直接退款。

            ---

            ### **关键执行原则**

            1. **风险规避**：

            - 小账号（<1000单）以**退款优先**，欧洲站尤其敏感。

            - 大账号（>1000单）以**成本控制**为导向，优先协商补寄。

            2. **态度导向**：

            - 买家语气强硬时，跳过等待期直接补偿（参考延迟时长梯度）。

            3. **效率优化**：

            - 所有“签收未收到”案例首次回复需包含**自查步骤清单**，减少二次沟通。

            </常规处理思路>

