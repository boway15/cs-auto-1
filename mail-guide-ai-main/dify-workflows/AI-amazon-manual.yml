          \              trajectory_details.append({\n                    \"轨迹信息\"\
          : item1.get(\"StatusDescription\", \"\"),\n                    \"轨迹时间\"\
          : item1.get(\"Date\", \"\")\n                })\n            # 所有字段设置默认值防止KeyError\n\
          \            transformed.append({\n                \"跟踪单号\": item.get(\"\
          TrackingNumber\", \"\"),\n                \"物流状态\": item.get(\"ThirdPartyStatus\"\
          , \"\"),\n                \"包裹状态\": item.get(\"PackageStatus\", \"\"),\n\
