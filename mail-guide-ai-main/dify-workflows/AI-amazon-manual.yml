          \       data = json.loads(http_response)\n    except json.JSONDecodeError\
          \ as e:\n        return json.dumps(\n            {\"error\": \"Invalid JSON\
          \ format\", \"detail\": str(e)},\n            ensure_ascii=False\n     \
          \   )\n\n    transformed = []\n    try:\n        # 处理根层结构异常\n        package_list\
