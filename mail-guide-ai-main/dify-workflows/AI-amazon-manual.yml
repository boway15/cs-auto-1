          : item.get(\"TrajectoryStatus\", \"\"),\n                \"物流轨迹详情\": trajectory_details\n\
          \            })\n    except AttributeError as e:\n        return json.dumps(\n\
          \            {\"error\": \"Unexpected data structure\", \"detail\": str(e)},\n\
          \            ensure_ascii=False\n        )\n\n    return {\n        \"packageInfo\"\
          : json.dumps(transformed,  ensure_ascii=False)\n    }"
