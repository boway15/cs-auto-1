            \n1. 首先确认物流轨迹是否显示“已妥投”且无破损、退回或被拒收记录。\n2. 检查签收地址与买家地址是否一致：\n   - 如果省州一致但市不一致，且两地距离较近，按正常妥投处理。\n\
            \   - 如果省州和市都不一致，向用户道歉并解释可能送错地址，协商补寄或退款。\n3. 检查是否有签收人：\n   - 如果签收人姓名与用户相似或相同，提醒用户确认家人或邻居是否代收。\n\
            \   - 如果签收人姓名完全不同，询问用户是否认识该签收人，并建议查监控或联系承运人。\n4. 如果是公寓地址：\n   - 有妥投图片的，告知用户图片信息并建议尝试取件。\n\
            \   - 无妥投图片的，建议用户检查公寓包裹室或联系工作人员。\n5. 检查妥投图片：\n   - 图片不确认地址的，让用户确认位置并尝试查找。\n\
            \   - 图片显示邻居家的，建议用户去邻居家取件。\n   - 图片确认地址的，提醒用户检查家人或邻居是否代收。\n6只能参考其客户处理格式和解决思路，不能直接使用里面的客户数据，内容在<example>xml里面.\n\
            7. 如果包裹放在包裹点待取，提供包裹点信息和营业时间，让用户自行取件。\n8.当前买家信息内容在<买家订单信息>xml里面.\n9.当前买家物流内容在<买家物流信息>xml里面.\n\
            10.买家店铺信息内容在<店铺信息>xml里面.\n11.不允许答复结果是中文，按照用户语种\n12.今天的日期是:{{#1742383367610.curDate#}}\n\
