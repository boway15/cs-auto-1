    - data:
        code: |
          import json

          def as_dict(value):
              if isinstance(value, dict):
                  return value
              if isinstance(value, str) and value.strip():
                  try:
                      parsed = json.loads(value)
                      return parsed if isinstance(parsed, dict) else {}
                  except Exception:
                      return {}
              return {}

          def as_text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              try:
                  return json.dumps(value, ensure_ascii=False)
              except Exception:
                  return str(value)

          def main(body=None, error_message: str = "", error_type: str = "") -> dict:
              raw = as_dict(body)
              data = as_dict(raw.get("data")) if "data" in raw else raw
              email = as_dict(data.get("email"))
              return {
                  "ok": bool(raw.get("success", not bool(error_message))),
                  "error_message": error_message or as_text(raw.get("message")),
                  "error_type": error_type or as_text(raw.get("code")),
                  "email_id": as_text(email.get("email_id")),
                  "email_subject": as_text(email.get("subject")),
                  "email_body": as_text(email.get("body")),
                  "email_attachments": as_text(email.get("attachments")),
