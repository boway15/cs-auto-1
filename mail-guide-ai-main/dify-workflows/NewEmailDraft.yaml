    - data:
        code: |
          import re

          THINK_PATTERNS = (
              r"<think>.*?</think>",
              r"<thinking>.*?</thinking>",
          )

          def strip_thinking_blocks(s: str) -> str:
              for pat in THINK_PATTERNS:
                  s = re.sub(pat, "", s, flags=re.DOTALL | re.IGNORECASE)
              return s.strip()

          DRAFT_PH_PATTERNS = (
              r"\[您的姓名\]",
              r"\[您的职位\]",
              r"\[公司名称\]",
              r"\[联系邮箱\]",
              r"\[Company\s+Name\]",
              r"\[Your\s+Name\]",
              r"\[Phone\]",
              r"\[Email\]",
              r"\[客服署名\]",
              r"（请在此处[^）]{1,200}）",
              r"___+待填_+___",
              r"（待补充）",
          )

          def sanitize_draft_placeholders(s: str) -> str:
              t = s or ""
              for pat in DRAFT_PH_PATTERNS:
                  t = re.sub(pat, "", t, flags=re.IGNORECASE)
              t = re.sub(r"\n*\[客服署名\][\s\S]*$", "", t)
              t = re.sub(r"\n*（请在此处[^）]{1,200}）[\s\S]*$", "", t)
              t = re.sub(r"(?m)^\s*例如[:：].+$", "", t)
              t = re.sub(r"[ \t]+\n", "\n", t)
              t = re.sub(r"\n{3,}", "\n\n", t)
              lines = [ln for ln in t.splitlines()]
              while lines and re.match(
                  r"^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,48}\s*$",
                  lines[-1].strip(),
              ):
                  lines.pop()
              while lines and not lines[-1].strip():
                  lines.pop()
              t = "\n".join(lines)
              return t.strip()

          def main(text: str) -> dict:
              text = strip_thinking_blocks(text or "")
              intent_match = re.search(
                  r'(?:\[Intent Analysis\]|\[意图分析\])(.*?)(?=(?:\[Reply Draft\]|\[回复草稿\])|$)',
                  text,
                  re.DOTALL | re.IGNORECASE
              )
              draft_match = re.search(
                  r'(?:\[Reply Draft\]|\[回复草稿\])(.*?)$',
                  text,
                  re.DOTALL | re.IGNORECASE
              )
              draft_raw = draft_match.group(1).strip() if draft_match else text.strip()

              return {
                  "intent_analysis": intent_match.group(1).strip() if intent_match else "",
                  "draft_reply": sanitize_draft_placeholders(draft_raw),
              }
        code_language: python3
        desc: 将 LLM 输出拆分为结构化意图和草稿字段
        error_strategy: fail-branch
        outputs:
