            - label: 发件人邮箱
              max_length: 500
              options: []
              required: true
              type: text-input
              variable: from_email
            - label: 附件信息
              max_length: 5000
              options: []
              required: false
              type: text-input
              variable: attachments
            - label: 附件内容
              allowed_file_types:
              - image
              - document
              allowed_file_upload_methods:
              - local_file
              - remote_url
              max_length: 10
              required: false
              type: file-list
              variable: attachment_files
        height: 198
        id: start
        position:
          x: 80
          y: 260
        positionAbsolute:
          x: 80
          y: 260
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 使用 LLM 分析邮件意图、情绪、风险等级等信息
          title: AI 邮件分析
          type: llm
          model:
            completion_params:
              temperature: 0.2
            mode: chat
            name: deepseek-v4-flash
            provider: langgenius/deepseek/deepseek
          prompt_template:
            - role: system
              text: |
                You are an email analysis assistant for cross-border e-commerce CS. Return ONE valid JSON object only — no markdown, no code fences, no thinking tags, nothing before "{".
                Example: {"intent":"after_sale","business_intent":"damaged","category":"售后","order_no":"SO20240315001","is_info_complete":false,"missing_elements":["order_no","attachment"],"summary":"客户反馈收到的商品有破损，要求退款","priority":"high","risk_level":"normal","sentiment":"frustrated","language":"zh","entities":{"order_no":null,"product_name":"Wireless Mouse"}}

                ## Fields
                - intent: after_sale|refund|cancel_order|change_address|shipping_query|general
                - business_intent (required, one of): order_cancel, address_change, delay_shipping, sku_change, damaged, defect, description_mismatch, logistics, other, amazon_marketplace, product_inquiry, conversation_idle, solution_accepted
                - category: 售后 = order_cancel/address_change/delay_shipping/sku_change/damaged/defect/description_mismatch; 咨询 = all others
                - order_no: extract if present (letters+digits or 订单号/Order No label); else null
                - is_info_complete: damaged/defect/description_mismatch → true only if order_no + attachment; order_cancel/address_change/delay_shipping/sku_change/logistics → true if order_no present; product_inquiry/conversation_idle/solution_accepted → true; other → true
                - missing_elements: [] or any of order_no, attachment, image, product
                - summary: Chinese, ≤200 chars | priority: urgent|high|normal|low | risk_level: high only for order_cancel/address_change/delay_shipping/sku_change; else normal
                - sentiment: angry|frustrated|neutral|happy
                - language: Latest predominantly Chinese → zh; predominantly English → en; if Chinese/English mix and counts are close → en; else other
                - entities: {order_no, product_name, amount}

                ## missing_elements (MUST apply before output)
                - business_intent damaged/defect/description_mismatch AND no attachment in email → missing_elements MUST include "attachment"
                - business_intent order_cancel/address_change/delay_shipping/sku_change/damaged/defect/description_mismatch/logistics AND order_no is null → missing_elements MUST include "order_no"
                - product unclear in after-sale context → add "product"
                - otherwise → missing_elements: []

                ## Core principle
                Classify from **Latest body**. Full body is quote/context only — never label cancel/damage/defect from quoted merchant text alone. Check entire email (including forwarded parts) ONLY for **Amazon channel** signals (order actually from Amazon), NOT mere price-comparison mentions. **business_intent must match summary**: if summary says customer did NOT request cancel/refund → business_intent cannot be order_cancel; if summary says 延迟/暂缓/暂停发货 → business_intent must be delay_shipping, not logistics.

                ## business_intent priority (first match wins; other = last resort)
                1. amazon_marketplace — **only when this case is an Amazon-channel order**: *@amazon.com sender, Amazon order id (###-#######-#######), or customer clearly states they **purchased on Amazon** (在亚马逊购买 / purchased on Amazon / my Amazon order / Amazon order #…). **NOT** amazon_marketplace when customer only cites Amazon as cheaper competitor, asks price match, or wants to cancel/return an **independent-site order** they placed with you (→ order_cancel).
                2. solution_accepted — accepts refund/replacement/reship already offered (OK/好的/同意/accept/agree)
                3. order verification → other (NOT order_cancel): Latest body is **only supplying order facts** (any subset: time, card digits, product, name, address, phone — format may be incomplete or non-standard). No explicit customer request (cancel/refund/return/complain/ask/check status). Often replies to merchant security/fraud review. Merchant quote "cancel if no reply" ≠ customer cancel. Partial info still counts (e.g. only product + address). **Exception**: if Latest asks to check order/status/tracking (查订单/where is my order/any update) even with facts listed → NOT verification; use logistics or other instead. business_intent=other, risk_level=normal.
                4. order_cancel — customer explicitly asks to cancel in Latest body (customer's own words, not quoted)
                5. address_change — customer asks to change address
                6. delay_shipping — customer asks to postpone/hold shipment (暂缓发货/晚点发/先别发/ship later); not cancel, not tracking inquiry
                7. sku_change — customer asks to change SKU/variant/color/size/item **before shipment** (换SKU/换颜色/换尺码/change variant); not cancel, not delay-only, not wrong-item-after-delivery complaint
                8. damaged — physical broken/crushed/damage (Latest body)
                9. product_inquiry — pre-sales/install/how-to; also install difficulty + defect both present → product_inquiry (CS guides install first). Exception: hard physical damage (断裂/screen shattered) → defect.
                10. defect — not working/quality issue, only if no install signals or hard physical damage stated
                11. description_mismatch — wrong item / not as described
                12. logistics — shipping/tracking/delivery
                13. conversation_idle — thank-you/case closed, no new request
                14. other — only when 1–13 all clearly fail

                ## Key rules
                - Amazon channel vs price comparison: amazon_marketplace ONLY for confirmed Amazon-channel cases (see #1). Mentioning Amazon cheaper / price match / screenshot from Amazon / "go with Amazon" while canceling or returning **your** order → order_cancel, NOT amazon_marketplace.
                - Cancel vs verification: order_cancel ONLY if customer explicitly requests cancel in Latest body. If Latest only lists order facts (even partial/informal) with no request verb → other, NOT order_cancel. If Latest lists facts BUT also asks to check order/status/shipping → logistics or other (NOT verification-only other). Do NOT infer cancel from Full body merchant deadline warnings.
                - Install + defect: both present → product_inquiry, unless hard physical damage → defect.
                - After-sale intents: Latest body only; quoted history doesn't count unless customer repeats in Latest.

                ## Quick examples
                - buyer@amazon.com or Amazon order id in thread → amazon_marketplace (even if Latest mentions cancel)
                - Latest: "Amazon is cheaper ($159), please cancel my Sedeta order / explain return & shipping label" → order_cancel (price comparison on independent-site order, NOT amazon_marketplace)
                - Thread: "I placed directly with you; Amazon has same item cheaper; price match?" → order_cancel
                - Latest: "walnut dresser\n3701 guthrie circle lawrenceville ga 30044" (only product+address, security review in quote) → other
                - Latest: "order time: 11pm, 0053, walnut dresser, bridgett baranda, 3701 guthrie circle" → other
                - Latest: "订单号 SO123，产品是桌子，请帮我查一下状态" → logistics (has check-status request, NOT verification-only)
                - "Please cancel my order #12345" → order_cancel
                - "Please don't ship until next Monday, order SO123" → delay_shipping
                - "Please change my order to the blue variant / size L before you ship, order SO123" → sku_change
                - "装不上，孔位不对，是不是质量问题" → product_inquiry
                - "屏幕碎了，完全无法开机" → defect
                - "product doesn't work" (no install mention) → defect
                - "OK please process the refund" → solution_accepted
                - "Thanks!" only → conversation_idle
            - role: user
              text: |
                Subject: {{#start.subject#}}
                From: {{#start.from_email#}}
                Latest body: {{#start.body_latest#}}
                Full body (quotes, reference only): {{#start.body_text#}}
                Attachments: {{#start.attachments#}}
          vision:
            enabled: false
            configs:
              variable_selector: []
          memory:
            enabled: false
            window:
              enabled: false
              size: 50
          context:
            enabled: false
            variable_selector: []
          structured_output:
            enabled: false
          retry_config:
            enabled: false
            max_retries: 1
            retry_interval: 1000
            exponential_backoff:
              enabled: false
              multiplier: 2
              max_interval: 10000
          variables: []
        height: 90
        id: llm_analyze
        position:
          x: 420
          y: 260
        positionAbsolute:
          x: 420
          y: 260
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            def main(
                llm_output: str,
                subject: str = "",
                from_email: str = "",
                body_latest: str = "",
                body_text: str = "",
            ) -> dict:
                import json
                import re

                def _s(v) -> str:
                    if v is None:
                        return ""
                    return str(v).strip()

                subject_s = _s(subject)
                from_s = _s(from_email)
                latest_s = _s(body_latest)
                full_s = _s(body_text)

                def strip_quoted_reply(body: str) -> str:
                    if not body:
                        return ""
                    split_patterns = [
                        r"\n\s*On .{5,120} wrote:\s*\n",
                        r"\n\s*在 .{5,120} wrote:\s*\n",
                        r"\n\s*-{3,}\s*Original Message\s*-{3,}\s*\n",
                        r"\n\s*-{3,}\s*Forwarded message\s*-{3,}\s*\n",
                        r"\n\s*From:\s*.+\n(?:Sent|Date):\s*.+\n",
                        r"\n\s*发件人[:：].+\n(?:发送时间|日期)[:：].+\n",
                    ]
                    text = body
                    best = len(text)
                    for pat in split_patterns:
                        m = re.search(pat, text, re.I)
                        if m and m.start() < best:
                            best = m.start()
                    if best < len(text):
                        text = text[:best]
                    return text.strip()

                def resolve_effective_latest() -> str:
                    if latest_s:
                        return latest_s
                    return strip_quoted_reply(full_s)

                effective_latest = resolve_effective_latest()
                analysis_text = "\n".join(
                    x for x in (subject_s, effective_latest) if x
                ).strip()
                thread_text = "\n".join(
                    x for x in (subject_s, effective_latest, full_s) if x
                ).strip()

                def looks_like_amazon_price_comparison(text: str) -> bool:
                    return bool(
                        re.search(
                            r"amazon.{0,80}(cheaper|much cheaper|less|lower|selling|is having|has the same|for\s*\$|same product|same item)|"
                            r"(cheaper|price match|match.{0,25}(the )?same price|same price).{0,50}amazon|"
                            r"go with amazon|unless you.{0,40}(match|able to match)|"
                            r"(found|saw|see|sharing|share|screenshot|picture).{0,50}amazon|"
                            r"amazon.{0,40}(picture|screenshot|screen\s*shot)|"
                            r"on (the )?amazon (website|site)|"
                            r"(higher|more expensive).{0,40}(price|pay).{0,40}(amazon|cheaper)|"
                            r"justification.{0,30}(pay|higher)|"
                            r"ordered from (them|amazon).{0,60}(return|keep your|cancel this)|"
                            r"available at.{0,30}cheaper",
                            text,
                            re.I,
                        )
                    )

                def looks_like_independent_site_order_context(text: str) -> bool:
                    return bool(
                        re.search(
                            r"cancel this order|placed directly (with|on)|on your (site|website|store)|"
                            r"directly with|order (SEDETA|SO\d|#[A-Z0-9]{4,})|"
                            r"would like to cancel.{0,40}(order|this)|"
                            r"I placed.{0,30}(with you|on your|directly)",
                            text,
                            re.I,
                        )
                    )

                def looks_like_amazon_channel_confirmed(text: str, sender: str) -> bool:
                    if re.search(
                        r"@amazon\.(com|co\.uk|de|fr|it|es|ca|com\.au|co\.jp)\b",
                        sender,
                        re.I,
                    ):
                        return True
                    if re.search(r"\b\d{3}-\d{7}-\d{7}\b", text):
                        return True
                    if re.search(
                        r"在亚马逊(上)?(购买|下单|买的)|亚马逊渠道|"
                        r"purchased on amazon|bought on amazon|ordered (on|from|through) amazon|"
                        r"my amazon (order|purchase)|"
                        r"amazon order\s*(#|number|no\.?|id)[:#\s]?\s*[\d-]+",
                        text,
                        re.I,
                    ):
                        if (
                            looks_like_amazon_price_comparison(text)
                            and looks_like_independent_site_order_context(text)
                        ):
                            return False
                        return True
                    return False

                def looks_like_amazon(text: str, sender: str) -> bool:
                    return looks_like_amazon_channel_confirmed(text, sender)

                def should_correct_amazon_to_cancel(
                    thread: str, latest: str, sender: str, bi: str,
                ) -> bool:
                    if bi != "amazon_marketplace":
                        return False
                    if re.search(
                        r"@amazon\.(com|co\.uk|de|fr|it|es|ca|com\.au|co\.jp)\b",
                        sender,
                        re.I,
                    ):
                        return False
                    if re.search(r"\b\d{3}-\d{7}-\d{7}\b", thread):
                        return False
                    if not looks_like_amazon_price_comparison(thread):
                        return False
                    if looks_like_independent_site_order_context(thread):
                        return True
                    if looks_like_customer_cancel_request(latest):
                        return True
                    return bool(
                        re.search(
                            r"return process|return shipping label|shipping label|price match",
                            latest,
                            re.I,
                        )
                    )

                def looks_like_solution_accepted(text: str) -> bool:
                    return bool(
                        re.search(
                            r"同意.{0,16}(方案|处理|退款|换货|补发|重发)|"
                            r"接受.{0,10}方案|按.{0,8}(说|办|处理)|"
                            r"可以.{0,6}(退款|换货|补发)|没问题|"
                            r"accept (the )?(offer|solution|refund)|"
                            r"agree to (the )?(refund|replacement|solution)|"
                            r"proceed with (the )?(refund|replacement|reship)|"
                            r"sounds good.*(refund|replace)|"
                            r"ok.{0,20}(refund|replace|换货|退款)|"
                            r"yes.{0,20}(refund|replace|换货|退款)",
                            text,
                            re.I,
                        )
                    )

                def agent_offered_solution_in_thread(text: str) -> bool:
                    return bool(
                        re.search(
                            r"(offer|propose|provide|arrange).{0,40}(refund|replacement|reship)|"
                            r"(退款|换货|补发|重发|赔偿).{0,20}(方案|处理|offer)|"
                            r"we can (refund|replace|reship)|可以(为您)?(退款|换货|补发)",
                            text,
                            re.I,
                        )
                    )

                def looks_like_installation_issue(text: str) -> bool:
                    return bool(
                        re.search(
                            r"怎么安装|如何安装|安装步骤|安装问题|安装说明|装不上|装不了|不会装|安装不了|组装|"
                            r"assembly|how to install|how do i install|put together|setup|"
                            r"instruction manual|说明书|assemble|cannot assemble|can't assemble|"
                            r"assembly issue|install issue|pieces don'?t fit|parts don'?t fit|"
                            r"holes don'?t align|won'?t line up|missing screw|对不齐|孔位",
                            text,
                            re.I,
                        )
                    )

                def looks_like_defect_signal(text: str) -> bool:
                    return bool(
                        re.search(
                            r"缺陷|defect|defective|not\s*working|malfunction|质量问题|品质问题|次品|劣质|"
                            r"doesn'?t work|don'?t work|won'?t work|不工作|用不了|有问题|"
                            r"功能.{0,4}(坏|异常|故障)|quality issue|faulty",
                            text,
                            re.I,
                        )
                    )

                def looks_like_installation_with_defect(text: str) -> bool:
                    return looks_like_installation_issue(text) and looks_like_defect_signal(text)

                def looks_like_product_inquiry(text: str) -> bool:
                    return looks_like_installation_issue(text) or bool(
                        re.search(
                            r"规格|多少钱|price\b|in stock|有货|售前|before (i )?order",
                            text,
                            re.I,
                        )
                    )

                def looks_like_merchant_security_review(text: str) -> bool:
                    return bool(
                        re.search(
                            r"security review|fraud|unusual.{0,20}order|"
                            r"confirm.{0,40}order.{0,30}(placed|by yourself|legality|verify)|"
                            r"last\s*4\s*digits.{0,30}(payment|purchase|card)|"
                            r"verify.{0,20}order|protect you from potential fraud|"
                            r"安全.{0,8}审核|核实.{0,12}订单|验证.{0,12}订单|"
                            r"确认.{0,12}订单.{0,12}(本人|自己)",
                            text,
                            re.I,
                        )
                    )

                def looks_like_delay_shipping_request(latest: str) -> bool:
                    if re.search(
                        r"sorry\s+for\s+(the\s+)?delay|apologize.*delay|延误.*抱歉",
                        latest,
                        re.I,
                    ) and not re.search(
                        r"don'?t\s+ship|do\s+not\s+ship|暂缓|晚.{0,4}发|延迟发货|ship\s+later|postpone|hold\s+(the\s+)?order",
                        latest,
                        re.I,
                    ):
                        return False
                    return bool(
                        re.search(
                            r"延迟发货|暂缓发货|暂停发货|晚点发货|晚几天发|先别发|不要发货|暂不发货|先不要发|"
                            r"等我.{0,12}再发|发货.{0,6}暂缓|暂停.{0,6}发货|"
                            r"ship\s+later|postpone\s+(the\s+)?(shipment|delivery|order)|"
                            r"hold\s+(the\s+)?(shipment|order|delivery)|"
                            r"don'?t\s+ship\s+(yet|until|before|for)|"
                            r"do\s+not\s+ship\s+(yet|until|before|for)|"
                            r"wait\s+(to\s+)?ship|delay\s+(the\s+)?(shipment|shipping|delivery)|"
                            r"please\s+hold\s+my\s+order",
                            latest,
                            re.I,
                        )
                    )

                def looks_like_sku_change_request(latest: str) -> bool:
                    if looks_like_delay_shipping_request(latest):
                        return False
                    if re.search(
                        r"取消订单|cancel\s*(my|the)\s*order|want to cancel|please cancel",
                        latest,
                        re.I,
                    ):
                        return False
                    if re.search(
                        r"发错|错发|收到.{0,8}不对|wrong\s*item|not what i ordered",
                        latest,
                        re.I,
                    ):
                        return False
                    return bool(
                        re.search(
                            r"换\s*sku|更换\s*sku|改\s*sku|change\s*(the\s*)?(sku|variant|item|product)|"
                            r"swap\s+(to|for)|different\s+(color|size|variant)|replace\s+with|"
                            r"换款式|换颜色|换尺码|换型号|换大一号|换小一号|更换商品|改款式|改颜色|改尺码|"
                            r"发货前.{0,8}换|换成.{0,12}(款|色|码|型号)",
                            latest,
                            re.I,
                        )
                    )

                def looks_like_customer_cancel_request(latest: str) -> bool:
                    if looks_like_delay_shipping_request(latest):
                        return False
                    return bool(
                        re.search(
                            r"取消订单|我要取消|请取消|帮我取消|不想买了|不要了|"
                            r"want to cancel|please cancel|cancel (my |the )?order|"
                            r"cancel it|need to cancel|would like to cancel|"
                            r"stop (my )?order|do not ship|don't ship",
                            latest,
                            re.I,
                        )
                    )

                def looks_like_active_customer_request(latest: str) -> bool:
                    return bool(
                        re.search(
                            r"please (?!confirm)|want to|need to|help me|complain|refund|return|"
                            r"damage|broken|defect|not working|doesn'?t work|"
                            r"投诉|退款|退货|破损|损坏|怎么回事|why did|how come|unhappy|"
                            r"when will|where is|tracking|ship(ping)?|delivery|物流|快递|什么时候发|"
                            r"查订单|查一下|帮我查|订单状态|check (my )?order|order status|any update|"
                            r"please check|help check|status of my order",
                            latest,
                            re.I,
                        )
                    )

                def has_product_hint(text: str) -> bool:
                    return bool(
                        re.search(
                            r"product|item|type\s*:|dresser|drawer|table|chair|bed|sofa|desk|cabinet|"
                            r"walnut|\([^)]*drawer|商品|产品",
                            text,
                            re.I,
                        )
                    )

                def has_address_hint(text: str) -> bool:
                    return bool(
                        re.search(
                            r"\d+\s+\w+\s+(?:street|st|circle|ave|avenue|road|rd|drive|dr|lane|ln|court|ct|way|blvd|boulevard)\b|"
                            r"\b[A-Z]{2}\s+\d{5}(?:-\d{4})?\b|"
                            r"shipping address|收货地址|地址",
                            text,
                            re.I,
                        )
                    )

                def has_time_or_digits_hint(text: str) -> bool:
                    return bool(
                        re.search(
                            r"order\s*time|下单时间|购买时间|purchase\s*time|"
                            r"\d{1,2}\s*(?:am|pm)\s*\d|\d{1,2}/\d{1,2}/\d{2,4}|"
                            r"(?:last\s*)?(?:4\s*)?digits|payment\s*method|卡号|尾号|\b\d{4}\b",
                            text,
                            re.I,
                        )
                    )

                def has_name_hint(text: str) -> bool:
                    return bool(
                        re.search(
                            r"contact\s*name|contact\s*:|name\s*:|recipient|姓名|联系人",
                            text,
                            re.I,
                        )
                    )

                def count_order_detail_signals(latest: str) -> int:
                    return sum(
                        1
                        for fn in (
                            has_product_hint,
                            has_address_hint,
                            has_time_or_digits_hint,
                            has_name_hint,
                        )
                        if fn(latest)
                    )

                def summary_indicates_verification_not_cancel(summary: str) -> bool:
                    if not summary:
                        return False
                    if re.search(r"要求取消|请求取消|ask.*cancel|want.*cancel|取消订单", summary, re.I):
                        return False
                    return bool(
                        re.search(
                            r"核验|验证|verification|安全审核|未提出取消|未.*取消|not.*cancel|"
                            r"no cancel|provid(e|ing).{0,12}(order|信息|核验|验证)|"
                            r"订单事实|补充.*信息|security review|支付尾号|收货地址",
                            summary,
                            re.I,
                        )
                    )

                def looks_like_order_verification_response(latest: str, thread: str) -> bool:
                    if not latest.strip():
                        return False
                    if looks_like_customer_cancel_request(latest):
                        return False
                    if looks_like_active_customer_request(latest):
                        return False
                    has_review = looks_like_merchant_security_review(thread)
                    signals = count_order_detail_signals(latest)
                    lines = [ln.strip() for ln in latest.splitlines() if ln.strip()]
                    # Merchant security review + any 2+ fact types (partial OK)
                    if has_review and signals >= 2:
                        return True
                    # Security review + multi-line factual reply without request verbs (non-standard format OK)
                    if has_review and len(lines) >= 2 and not re.search(
                        r"\?|!|please|want |need |help |damage|broken|defect|refund|complain|"
                        r"破损|损坏|退款|投诉|tracking|物流|快递",
                        latest,
                        re.I,
                    ):
                        return True
                    # Security review + single fact line, short data-only reply
                    if has_review and signals >= 1 and len(lines) <= 6 and len(latest) < 400:
                        if not re.search(
                            r"\?|please|want |need |help |damage|broken|defect|refund",
                            latest,
                            re.I,
                        ):
                            return True
                    return False

                def looks_like_conversation_idle(text: str) -> bool:
                    if looks_like_solution_accepted(text):
                        return False
                    compact = re.sub(r"\s+", " ", text).strip()
                    if len(compact) > 600:
                        return False
                    if re.search(
                        r"问题已解决|已解决|结案|no further (action|help)|case closed|resolved|all set now",
                        text,
                        re.I,
                    ):
                        return True
                    if re.search(
                        r"^(thanks?|thank you|thx|many thanks|appreciate it|收到|好的收到|感谢)[\s!.，,]*$",
                        compact,
                        re.I,
                    ):
                        return True
                    if re.search(r"谢谢|感谢|多谢|thanks|thank you|appreciate", text, re.I) and not re.search(
                        r"破损|损坏|退款|取消|defect|damage|broken|投诉|refund|cancel",
                        text,
                        re.I,
                    ):
                        return True
                    return False

                def infer_from_text_priority(latest: str, thread: str, sender: str) -> str:
                    """Walk priority ladder; return 'other' only if nothing matches."""
                    if looks_like_amazon(thread, sender):
                        return "amazon_marketplace"
                    if looks_like_solution_accepted(latest) or (
                        looks_like_solution_accepted(thread)
                        and agent_offered_solution_in_thread(full_s)
                    ):
                        return "solution_accepted"
                    if looks_like_order_verification_response(latest, thread):
                        return "other"
                    if looks_like_customer_cancel_request(latest):
                        return "order_cancel"
                    if re.search(
                        r"取消订单|(?:please|want to|need to|我要|请).{0,12}cancel|cancel\s*(my|the)\s*order",
                        latest,
                        re.I,
                    ):
                        return "order_cancel"
                    if re.search(r"修改地址|change\s*address|update\s*address", latest, re.I):
                        return "address_change"
                    if looks_like_delay_shipping_request(latest):
                        return "delay_shipping"
                    if looks_like_sku_change_request(latest):
                        return "sku_change"
                    if re.search(r"破损|broken|damage|damaged|crushed", latest, re.I):
                        return "damaged"
                    if looks_like_installation_with_defect(latest):
                        return "product_inquiry"
                    if re.search(
                        r"缺陷|defect|defective|not\s*working|malfunction|质量问题|品质问题|次品|劣质",
                        latest,
                        re.I,
                    ):
                        return "defect"
                    if re.search(
                        r"描述不符|与描述不符|mismatch|not\s*as\s*described|wrong\s*item|错发|发错",
                        latest,
                        re.I,
                    ):
                        return "description_mismatch"
                    if re.search(
                        r"物流|快递|发货|shipping|tracking|delivery|package",
                        latest,
                        re.I,
                    ):
                        return "logistics"
                    if looks_like_product_inquiry(latest):
                        return "product_inquiry"
                    if looks_like_conversation_idle(latest):
                        return "conversation_idle"
                    return "other"

                HOLD_BUSINESS_INTENTS = frozenset({
                    "order_cancel", "address_change", "delay_shipping", "sku_change",
                })

                def refine_business_intent(bi: str) -> str:
                    """Preserve hold intents; Amazon channel wins for consult labels only."""
                    if bi in HOLD_BUSINESS_INTENTS:
                        return bi
                    if bi == "other":
                        reinferred = infer_from_text_priority(effective_latest, thread_text, from_s)
                        if reinferred in HOLD_BUSINESS_INTENTS:
                            return reinferred
                        if looks_like_amazon(thread_text, from_s):
                            return "amazon_marketplace"
                        return reinferred
                    if bi == "conversation_idle":
                        if looks_like_solution_accepted(analysis_text) or (
                            looks_like_solution_accepted(thread_text)
                            and agent_offered_solution_in_thread(full_s)
                        ):
                            return "solution_accepted"
                        short_ok = len(effective_latest) < 120 and bool(
                            re.search(
                                r"^(好的?|可以|没问题|ok|yes|agree|confirmed)[\s!.，,]*$",
                                effective_latest,
                                re.I,
                            )
                        )
                        if short_ok and agent_offered_solution_in_thread(full_s):
                            return "solution_accepted"
                    if bi == "defect" and looks_like_installation_with_defect(effective_latest):
                        return "product_inquiry"
                    if looks_like_amazon(thread_text, from_s):
                        return "amazon_marketplace"
                    return bi

                if llm_output is None:
                    raw = ""
                elif not isinstance(llm_output, str):
                    raw = str(llm_output)
                else:
                    raw = llm_output

                for pat in (
                    r"<think>.*?</think>",
                    r"<thinking>.*?</thinking>",
                ):
                    raw = re.sub(pat, "", raw, flags=re.DOTALL | re.IGNORECASE)
                raw = raw.strip()

                def try_loads(s: str) -> dict:
                    try:
                        x = json.loads(s)
                        return x if isinstance(x, dict) else {}
                    except (json.JSONDecodeError, TypeError):
                        return {}

                result = try_loads(raw)
                if not result:
                    m = re.search(r"```(?:json)?\s*([\s\S]*?)\s*```", raw)
                    if m:
                        result = try_loads(m.group(1).strip())

                if not result:
                    i = raw.find("{")
                    if i >= 0:
                        try:
                            obj, _ = json.JSONDecoder().raw_decode(raw[i:])
                            result = obj if isinstance(obj, dict) else {}
                        except (json.JSONDecodeError, TypeError, ValueError):
                            result = {}

                if not result:
                    m = re.search(r"\{[\s\S]*\}", raw)
                    if m:
                        result = try_loads(m.group(0))

                if not isinstance(result, dict):
                    result = {}

                # Default values for missing fields
                defaults = {
                    "intent": "general",
                    "business_intent": "other",
                    "category": "咨询",
                    "order_no": None,
                    "is_info_complete": False,
                    "missing_elements": [],
                    "summary": "AI 分析失败，请人工处理",
                    "priority": "normal",
                    "risk_level": "normal",
                    "sentiment": "neutral",
                    "language": "en",
                    "entities": {},
                }
                for k, v in defaults.items():
                    if k not in result or result[k] is None:
                        result[k] = v

                # Validate intent
                valid_intents = ["after_sale", "refund", "cancel_order", "change_address", "shipping_query", "general"]
                if result["intent"] not in valid_intents:
                    result["intent"] = "general"

                # Validate business_intent (12 categories, single-select)
                valid_business_intents = [
                    "order_cancel", "address_change", "delay_shipping", "sku_change", "damaged", "defect",
                    "description_mismatch", "logistics", "other",
                    "amazon_marketplace", "product_inquiry",
                    "conversation_idle", "solution_accepted",
                ]
                if result["business_intent"] not in valid_business_intents:
                    fallback = {
                        "cancel_order": "order_cancel",
                        "change_address": "address_change",
                        "shipping_query": "logistics",
                    }.get(result["intent"], "other")
                    result["business_intent"] = fallback

                refined = refine_business_intent(str(result.get("business_intent") or "other"))
                if refined in valid_business_intents:
                    result["business_intent"] = refined

                if result["business_intent"] == "order_cancel":
                    summary_s = str(result.get("summary") or "")
                    if (
                        looks_like_order_verification_response(effective_latest, thread_text)
                        or summary_indicates_verification_not_cancel(summary_s)
                        or not looks_like_customer_cancel_request(effective_latest)
                    ):
                        result["business_intent"] = "other"
                        result["intent"] = "general"
                        result["category"] = "咨询"
                        result["risk_level"] = "normal"
                        if result.get("priority") == "urgent":
                            result["priority"] = "normal"

                if result["business_intent"] in ("logistics", "other"):
                    summary_s = str(result.get("summary") or "")
                    if (
                        looks_like_delay_shipping_request(effective_latest)
                        or looks_like_delay_shipping_request(summary_s)
                    ):
                        result["business_intent"] = "delay_shipping"
                        result["category"] = "售后"
                        result["risk_level"] = "high"
                    elif (
                        looks_like_sku_change_request(effective_latest)
                        or looks_like_sku_change_request(summary_s)
                    ):
                        result["business_intent"] = "sku_change"
                        result["category"] = "售后"
                        result["risk_level"] = "high"

                if (
                    looks_like_amazon(thread_text, from_s)
                    and result["business_intent"] not in HOLD_BUSINESS_INTENTS
                ):
                    result["business_intent"] = "amazon_marketplace"
                    result["category"] = "咨询"
                    if result.get("intent") in ("cancel_order", "change_address"):
                        result["intent"] = "general"
                    if result.get("risk_level") == "high":
                        result["risk_level"] = "normal"
                    if result.get("priority") == "urgent":
                        result["priority"] = "normal"

                if should_correct_amazon_to_cancel(
                    thread_text,
                    effective_latest,
                    from_s,
                    result["business_intent"],
                ):
                    result["business_intent"] = "order_cancel"
                    result["category"] = "售后"
                    result["intent"] = "cancel_order"
                    result["risk_level"] = "high"
                    if result.get("priority") == "normal":
                        result["priority"] = "urgent"

                if result["business_intent"] == "defect" and looks_like_installation_with_defect(effective_latest):
                    result["business_intent"] = "product_inquiry"
                    result["category"] = "咨询"
                    if result.get("priority") in ("urgent", "high"):
                        result["priority"] = "normal"

                consult = {
                    "logistics", "other", "amazon_marketplace", "product_inquiry",
                    "conversation_idle", "solution_accepted",
                }
                after_sale = {
                    "order_cancel", "address_change", "delay_shipping", "sku_change", "damaged", "defect",
                    "description_mismatch",
                }
                bi_final = result["business_intent"]
                if bi_final in after_sale:
                    result["category"] = "售后"
                elif bi_final in consult:
                    result["category"] = "咨询"

                # Validate priority
                valid_priorities = ["low", "normal", "high", "urgent"]
                if result["priority"] not in valid_priorities:
                    result["priority"] = "normal"

                return result
          code_language: python3
