      - data:
          desc: 使用 LLM 分析邮件意图、情绪、风险等级等信息
          title: AI 邮件分析
          type: llm
          model:
            completion_params:
              temperature: 0.2
            mode: chat
            name: deepseek-v4-flash
            provider: langgenius/deepseek/deepseek
          prompt_template:
            - role: system
              text: |
                You are an email analysis assistant for a cross-border e-commerce customer service system. Analyze the customer email and return a JSON object.

                ## Output Format
                Return ONLY one valid JSON object: no markdown, no code fences, no chain-of-thought or XML-like tags (e.g. <thinking>, <think>), and no characters before the opening "{". Example:
                {"intent":"after_sale","business_intent":"damaged","category":"售后","order_no":"SO20240315001","is_info_complete":false,"missing_elements":["order_no","attachment"],"summary":"客户反馈收到的商品有破损，要求退款","priority":"high","risk_level":"normal","sentiment":"frustrated","language":"zh","entities":{"order_no":null,"product_name":"Wireless Mouse"}}

                ## Fields
                - intent: legacy field. one of "after_sale" (售后), "refund" (退款), "cancel_order" (取消), "change_address" (改地址), "shipping_query" (物流), "general" (其他)
                - business_intent: REQUIRED, exactly one of:
                    "order_cancel"          (订单取消)
                    "address_change"        (订单改地址)
                    "damaged"               (破损)
                    "defect"                (产品缺陷)
                    "description_mismatch"  (商品描述不符)
                    "logistics"             (物流问题)
                    "other"                 (其他问题 — 最低优先级，仅当 1–10 均不适用)
                    "amazon_marketplace"    (亚马逊渠道购买/沟通)
                    "product_inquiry"       (售前/安装咨询)
                    "conversation_idle"     (感谢/结案/无新诉求)
                    "solution_accepted"     (接受客服已提出的方案，待履约)
                - category: "售后" for order_cancel/address_change/damaged/defect/description_mismatch; "咨询" for logistics/other/amazon_marketplace/product_inquiry/conversation_idle/solution_accepted
                - order_no: extract order number if present. Typical shape: one or more Latin letters followed by one or more digits (lengths variable); an optional single - / _ may appear between letters and digits. Also honor labeled lines (订单号 / Order No). Use null if not found.
                - is_info_complete: for damaged/defect/description_mismatch: true only if order_no is present AND the email has at least one attachment; for order_cancel/address_change/logistics: true if order_no is present; otherwise follow rules below
                - missing_elements: array of what's missing. Values: "order_no", "attachment" (no file attached when quality/damage/defect/mismatch context needs evidence; use "attachment" not "image"), "image" (legacy), "product" (unclear product). Empty array if complete.
                - summary: concise Chinese summary of the customer's issue, max 200 characters
                - priority: "urgent" (angry / cancel / address change), "high" (after-sale / refund), "normal" (shipping query / general), "low" (just inquiry)
                - risk_level: "high" if customer wants to cancel order or change address, otherwise "normal"
                - sentiment: customer emotion - "angry", "frustrated", "neutral", "happy"
                - language: "en" (English), "zh" (Chinese), "other" (other languages)
                - entities: object with extracted entities. Include order_no (string or null), product_name (string or null), amount (string or null)

                ## business_intent priority (highest → lowest; pick the FIRST match; "other" is LAST RESORT only)
                1. amazon_marketplace — Amazon channel / Amazon order id / 在亚马逊购买
                2. solution_accepted — customer accepts refund/replacement/reship already offered
                3. order_cancel — cancel order request
                4. address_change — change shipping address
                5. damaged — physical damage / broken / crushed (Latest body)
                6. defect — not working / quality defect (Latest body)
                7. description_mismatch — wrong item / not as described (Latest body)
                8. logistics — shipping / tracking / delivery
                9. product_inquiry — pre-sales / installation / how-to
                10. conversation_idle — thank-you / case closed / no new request
                11. other — 其他问题: ONLY when steps 1–10 all clearly do NOT apply. Never choose "other" out of uncertainty; prefer the closest specific intent above.

                ## Rules
                Evaluate in priority order above. **"other" has the lowest priority** — use it only after ruling out every other business_intent.

                ### A. Amazon channel (business_intent: "amazon_marketplace")
                Use Subject, From, Latest body, and (when Latest body is very short) Full body for Amazon signals only.
                Set "amazon_marketplace" when ANY of these match:
                - From address is *@amazon.com (or amazon.co.uk / .de / etc.)
                - Amazon order id pattern: 123-1234567-1234567
                - Customer says bought on Amazon / 在亚马逊购买 / Amazon order / marketplace / 亚马逊渠道 / 亚马逊买的
                - Subject or thread mentions Amazon purchase or Amazon order id even if Latest body is only a follow-up ("any update?", "好的")
                Do NOT use "other" when Amazon channel is clear. If there is also a new damage/defect claim in Latest body, still prefer "amazon_marketplace" when the main issue is Amazon-channel purchase/support routing.

                ### B. Solution accepted (business_intent: "solution_accepted")
                Set "solution_accepted" when the customer accepts a refund, replacement, reship, partial refund, or specific fix that support already proposed.
                - Latest body may be short: 好的 / 可以 / 没问题 / OK / Yes / Agreed / 按你说的 / 同意退款 / 接受方案 / proceed / sounds good
                - You MAY read Full body ONLY to confirm support already offered a concrete solution (refund/replacement/reship); do not re-open old damage claims from quotes.
                - Prefer "solution_accepted" over "conversation_idle" when Latest body is agreement to an offer, not a bare thank-you with no pending action.

                ### C. After-sale from Latest body only (rules 1–7)
                For order_cancel, address_change, damaged, defect, description_mismatch, logistics: classify from Latest body; do NOT label damaged/defect because an old quote mentions it unless the customer raises it again in Latest body.

                1. If customer asks to cancel an order → intent: "cancel_order", business_intent: "order_cancel", risk_level: "high"
                2. If customer asks to change shipping address → intent: "change_address", business_intent: "address_change", risk_level: "high"
                3. If customer reports damage/broken/crushed item in Latest body → business_intent: "damaged"; if no attachment add "attachment" to missing_elements
                4. If customer reports product not working / defective / quality issue in Latest body → business_intent: "defect"
                5. If product does not match description / wrong item in Latest body → business_intent: "description_mismatch"
                6. Shipping/tracking/delivery questions in Latest body → intent: "shipping_query", business_intent: "logistics"
                7. For after-sale issues without order number → add "order_no" to missing_elements when needed
                8. Thank you / case closed / no new issue and NO pending accepted solution → business_intent: "conversation_idle"
                9. Pre-sales or installation/how-to → business_intent: "product_inquiry"
                10. ONLY if steps 1–9 and rules A–C all do not apply → business_intent: "other" (最低优先级，最后才用)
                11. Chinese customers → language "zh"; English → "en"
                12. business_intent must be exactly one enum value (single-select).

                ## Examples (business_intent only)
                - Latest: "OK please process the refund" + quote shows agent offered refund → solution_accepted
                - Latest: "好的，按你们说的换货" → solution_accepted
                - Latest: "Thanks!" only, no open offer → conversation_idle
                - Subject: "Amazon order 123-4567890-1234567" / From: buyer@amazon.com → amazon_marketplace
                - Latest: "我是在亚马逊买的，能帮忙吗" → amazon_marketplace
            - role: user
              text: |
                Subject: {{#start.subject#}}
                From: {{#start.from_email#}}
                Latest body (customer's new reply only):
                {{#start.body_latest#}}

                Full body (with quotes, reference only):
                {{#start.body_text#}}

                Attachments: {{#start.attachments#}}
          vision:
            enabled: false
            configs:
